<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة+ — تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a227;
  --gold-light:#ddb828;
  --gold-dim:rgba(201,162,39,.1);
  --gold-border:rgba(201,162,39,.3);
  --green:#16a34a;
  --green-dim:rgba(22,163,74,.12);
  --red:#dc2626;
  --red-dim:rgba(220,38,38,.12);
  --text:#1a1a2e;
  --text2:#374151;
  --text3:#6b7280;
  --text4:#9ca3af;
  --border:rgba(0,0,0,.1);
  --border2:rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Cairo',sans-serif;
  min-height:100vh;
  background:linear-gradient(160deg,#f0f2f5 0%,#f5f7fa 60%,#eef0f3 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;color:var(--text);
}
.card{
  background:#ffffff;
  border:1px solid var(--border);
  border-radius:20px;
  width:100%;max-width:420px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.08);
}
.head{
  background:#fef9ed;
  padding:24px;text-align:center;
  border-bottom:1px solid var(--gold-border);
}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.logo-icon{
  width:40px;height:40px;border-radius:12px;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;
  box-shadow:0 4px 12px var(--gold-dim);
}
.logo-name{font-family:'Tajawal',sans-serif;font-size:1.6rem;font-weight:900;color:var(--text)}
.logo-name em{color:var(--gold);font-style:normal}
.head-sub{font-size:.78rem;color:var(--text3)}
.tabs{display:flex;border-bottom:1px solid var(--border2)}
.tab{
  flex:1;padding:13px;background:none;border:none;
  font-family:'Cairo',sans-serif;font-size:.88rem;font-weight:700;
  color:var(--text3);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:all .2s;
}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover{color:var(--text)}
.body{padding:22px 24px 24px;background:#ffffff}
.pane{display:none}.pane.on{display:block}
.fg{margin-bottom:14px}
.fl{font-size:.77rem;font-weight:700;color:var(--text2);margin-bottom:6px;display:block}
.fi{
  width:100%;padding:11px 13px;
  background:#f9fafb;
  border:1.5px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-family:'Cairo',sans-serif;font-size:.88rem;
  transition:all .2s;
}
.fi:focus{
  border-color:var(--gold);
  outline:none;
  background:#fff;
  box-shadow:0 0 0 3px var(--gold-dim);
}
.fi::placeholder{color:var(--text4)}
.alert{
  padding:10px 13px;border-radius:8px;font-size:.78rem;font-weight:600;
  margin-bottom:14px;display:none;align-items:center;gap:7px;
}
.alert.show{display:flex}
.alert.err{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);color:var(--red)}
.alert.ok{background:var(--green-dim);border:1px solid rgba(22,163,74,.25);color:var(--green)}
.btn{
  width:100%;padding:13px;border-radius:10px;
  background:var(--gold);
  border:none;
  color:#fff;
  font-family:'Cairo',sans-serif;font-size:.95rem;font-weight:900;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 12px var(--gold-dim);
}
.btn:hover{background:var(--gold-light);transform:translateY(-1px);box-shadow:0 6px 16px rgba(201,162,39,.2)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.sp{
  width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  animation:spin .7s linear infinite;display:none;
}
.btn.loading .sp{display:block}
.btn.loading .bt{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sw{text-align:center;font-size:.77rem;color:var(--text3);margin-top:14px}
.sw a{color:var(--gold);cursor:pointer;font-weight:700}
.sw a:hover{color:var(--gold-light)}
.dvd{
  display:flex;align-items:center;gap:10px;margin:14px 0;
  font-size:.75rem;color:var(--text4);
}
.dvd::before,.dvd::after{content:'';flex:1;height:1px;background:var(--border2)}
.gg{
  width:100%;padding:11px;border-radius:10px;
  background:#f9fafb;
  border:1.5px solid var(--border);
  color:var(--text2);
  font-family:'Cairo',sans-serif;font-size:.88rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;transition:all .2s;
}
.gg:hover{background:#f3f4f6;color:var(--text);border-color:#9ca3af}
.terms{font-size:.71rem;color:var(--text4);text-align:center;margin-top:12px;line-height:1.6}
.terms a{color:var(--gold);cursor:pointer}
.forgot{
  display:block;text-align:left;font-size:.74rem;
  color:var(--gold);cursor:pointer;margin-top:5px;
}
.forgot:hover{color:var(--gold-light)}
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="logo">
      <div class="logo-icon">✈</div>
      <div class="logo-name">رحلة<em>+</em></div>
    </div>
    <div class="head-sub" id="sub">إدارة مصاريف السفر الجماعي</div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" id="tL" onclick="go('login')">تسجيل الدخول</button>
    <button class="tab" id="tR" onclick="go('reg')">حساب جديد</button>
  </div>
  <div class="body">

    <!-- LOGIN -->
    <div class="pane on" id="pL">
      <div class="alert" id="aL"></div>
      <div class="fg">
        <label class="fl">📧 البريد الإلكتروني</label>
        <input class="fi" type="email" id="lE" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="fg">
        <label class="fl">🔒 كلمة المرور</label>
        <input class="fi" type="password" id="lP" placeholder="••••••••" autocomplete="current-password">
        <span class="forgot" onclick="go('reset')">نسيت كلمة المرور؟</span>
      </div>
      <button class="btn" id="bL" onclick="doLogin()"><div class="sp"></div><span class="bt">دخول ←</span></button>
      <div class="dvd">أو</div>
      <button class="gg" onclick="doGoogle()">
        <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        الدخول بـ Google
      </button>
      <div class="sw">ليس لديك حساب؟ <a onclick="go('reg')">سجّل الآن</a></div>
    </div>

    <!-- REGISTER -->
    <div class="pane" id="pR">
      <div class="alert" id="aR"></div>
      <div class="fg">
        <label class="fl">👤 الاسم الكامل</label>
        <input class="fi" type="text" id="rN" placeholder="محمد العامري">
      </div>
      <div class="fg">
        <label class="fl">📱 رقم الواتساب</label>
        <input class="fi" type="tel" id="rPh" placeholder="+971 50 000 0000">
      </div>
      <div class="fg">
        <label class="fl">📧 البريد الإلكتروني</label>
        <input class="fi" type="email" id="rE" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="fg">
        <label class="fl">🔒 كلمة المرور (٨ أحرف على الأقل)</label>
        <input class="fi" type="password" id="rP" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn" id="bR" onclick="doReg()"><div class="sp"></div><span class="bt">إنشاء الحساب ←</span></button>
      <div class="dvd">أو</div>
      <button class="gg" onclick="doGoogle()">
        <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        التسجيل بـ Google
      </button>
      <div class="terms">بالتسجيل أنت توافق على <a href="rehla-terms.html">شروط الخدمة</a> و<a href="rehla-privacy.html">سياسة الخصوصية</a></div>
      <div class="sw">لديك حساب؟ <a onclick="go('login')">سجّل دخولك</a></div>
    </div>

    <!-- RESET -->
    <div class="pane" id="pReset">
      <div style="color:var(--text3);font-size:.77rem;cursor:pointer;margin-bottom:14px" onclick="go('login')">← العودة</div>
      <div class="alert" id="aReset"></div>
      <div class="fg">
        <label class="fl">📧 البريد الإلكتروني</label>
        <input class="fi" type="email" id="resetE" placeholder="example@email.com">
      </div>
      <button class="btn" id="bReset" onclick="doReset()"><div class="sp"></div><span class="bt">إرسال رابط الاستعادة</span></button>
    </div>

    <!-- CONFIRM -->
    <div class="pane" id="pConfirm">
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:3rem;margin-bottom:12px">✉️</div>
        <div style="font-family:'Tajawal',sans-serif;font-size:1.3rem;font-weight:900;margin-bottom:8px;color:var(--text)">تحقق من بريدك!</div>
        <div style="font-size:.8rem;color:var(--text3);line-height:1.7;margin-bottom:20px">أرسلنا رابط تأكيد على بريدك الإلكتروني. افتحه للدخول للتطبيق.</div>
        <button class="btn" style="max-width:200px;margin:0 auto" onclick="go('login')"><span class="bt">العودة للدخول</span></button>
      </div>
    </div>

  </div>
</div>

<div style="text-align:center;margin-top:16px;font-size:.72rem;color:var(--text4)">
  © ٢٠٢٦ رحلة+ · <a href="index.html" style="color:var(--gold)">الرئيسية</a>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
window.addEventListener('load', function() {
  const SURL = 'https://pokpdwvqecwjfxoraqjd.supabase.co';
  const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBva3Bkd3ZxZWN3amZ4b3JhcWpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NDIzNzMsImV4cCI6MjA5MzMxODM3M30.O4ux4H4hQcUwMIyErQHIP5fAErXgru4wnTR4sOtvPUI';
  if (!window.supabase) { console.error('Supabase not loaded'); return; }
  const sb = window.supabase.createClient(SURL, SKEY, {
    auth: { autoRefreshToken:true, persistSession:true, detectSessionInUrl:true, flowType:'implicit' }
  });
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) location.href = 'rehla-dashboard.html';
  });

  window.go = function(tab) {
    ['pL','pR','pReset','pConfirm'].forEach(p => {
      const el=document.getElementById(p); if(el) el.classList.remove('on');
    });
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.getElementById('tabs').style.display = (tab==='reset'||tab==='confirm') ? 'none' : 'flex';
    if(tab==='login'){
      document.getElementById('pL').classList.add('on');
      document.getElementById('tL').classList.add('on');
      document.getElementById('sub').textContent='أهلاً بعودتك 👋';
    } else if(tab==='reg'){
      document.getElementById('pR').classList.add('on');
      document.getElementById('tR').classList.add('on');
      document.getElementById('sub').textContent='سجّل حسابك مجاناً';
    } else if(tab==='reset'){
      document.getElementById('pReset').classList.add('on');
    } else if(tab==='confirm'){
      document.getElementById('pConfirm').classList.add('on');
    }
    clearAlerts();
  };

  function showAlert(id, msg, type='err') {
    const el=document.getElementById(id); if(!el) return;
    el.textContent=msg; el.className=`alert show ${type}`;
  }
  function clearAlerts() {
    document.querySelectorAll('.alert').forEach(a => a.classList.remove('show'));
  }
  function setLoad(id, v) {
    const b=document.getElementById(id); if(!b) return;
    b.classList.toggle('loading',v); b.disabled=v;
  }
  function isEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  window.doLogin = async function() {
    const email=document.getElementById('lE').value.trim();
    const pass=document.getElementById('lP').value;
    if(!email||!pass){showAlert('aL','⚠️ يرجى ملء جميع الحقول');return}
    if(!isEmail(email)){showAlert('aL','⚠️ البريد الإلكتروني غير صحيح');return}
    setLoad('bL',true); clearAlerts();
    try {
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      showAlert('aL','✅ تم تسجيل الدخول — جاري التحويل...','ok');
      setTimeout(()=>location.href='rehla-dashboard.html',800);
    } catch(e) {
      const msg=e.message.includes('Invalid')?'❌ البريد أو كلمة المرور غير صحيحة':
        e.message.includes('Email not confirmed')?'📧 يرجى تأكيد بريدك الإلكتروني أولاً':'❌ '+e.message;
      showAlert('aL',msg);
    } finally {setLoad('bL',false);}
  };

  window.doReg = async function() {
    const name=document.getElementById('rN').value.trim();
    const phone=document.getElementById('rPh').value.trim();
    const email=document.getElementById('rE').value.trim();
    const pass=document.getElementById('rP').value;
    if(!name||!email||!pass){showAlert('aR','⚠️ يرجى ملء الحقول المطلوبة');return}
    if(!isEmail(email)){showAlert('aR','⚠️ البريد الإلكتروني غير صحيح');return}
    if(pass.length<8){showAlert('aR','⚠️ كلمة المرور يجب أن تكون ٨ أحرف على الأقل');return}
    setLoad('bR',true); clearAlerts();
    try {
      const {data,error}=await sb.auth.signUp({
        email, password:pass,
        options:{data:{full_name:name,phone},emailRedirectTo:'https://rehlasaa.com/rehla-auth.html'}
      });
      if(error)throw error;
      if(data.user&&!data.session){go('confirm');}
      else{
        showAlert('aR','✅ تم إنشاء الحساب — جاري التحويل...','ok');
        setTimeout(()=>location.href='rehla-dashboard.html',800);
      }
    } catch(e) {
      const msg=e.message.includes('already')?'⚠️ هذا البريد مسجل بالفعل — جرّب تسجيل الدخول':'❌ '+e.message;
      showAlert('aR',msg);
    } finally {setLoad('bR',false);}
  };

  window.doGoogle = async function() {
    try {
      const {error}=await sb.auth.signInWithOAuth({
        provider:'google',
        options:{redirectTo:'https://rehlasaa.com/rehla-dashboard.html'}
      });
      if(error)throw error;
    } catch(e) {showAlert('aL','❌ '+e.message);}
  };

  window.doReset = async function() {
    const email=document.getElementById('resetE').value.trim();
    if(!email){showAlert('aReset','⚠️ يرجى إدخال بريدك الإلكتروني');return}
    setLoad('bReset',true); clearAlerts();
    try {
      const {error}=await sb.auth.resetPasswordForEmail(email,{
        redirectTo:'https://rehlasaa.com/rehla-reset.html'
      });
      if(error)throw error;
      showAlert('aReset','✅ تم إرسال رابط الاستعادة — راجع بريدك','ok');
    } catch(e) {showAlert('aReset','❌ '+e.message);}
    finally{setLoad('bReset',false);}
  };

  document.getElementById('lP').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('rP').addEventListener('keydown',e=>{if(e.key==='Enter')doReg();});
});
</script>
</body>
</html>
